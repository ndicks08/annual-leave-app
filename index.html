<title>Leave Tracker</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f8fafc; color: #1e293b;
    padding: max(20px, env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  h1 { font-size: 20px; margin: 0; color: #0f172a; }
  .sub { font-size: 12px; color: #64748b; margin-top: 2px; }
  .iconbtn { background: none; border: none; padding: 8px; border-radius: 999px; color: #64748b; cursor: pointer; font-size: 20px; }
  .iconbtn:hover { background: #e2e8f0; }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .bal { border-radius: 18px; padding: 16px; color: #fff; }
  .bal.annual { background: linear-gradient(135deg,#6366f1,#4f46e5); }
  .bal.sick { background: linear-gradient(135deg,#14b8a6,#0d9488); }
  .bal .lab { font-size: 12px; opacity: .85; margin-bottom: 8px; }
  .bal .big { font-size: 30px; font-weight: 600; line-height: 1; }
  .bal .big span { font-size: 15px; font-weight: 400; opacity: .75; }
  .bal .days { font-size: 12px; opacity: .8; margin-top: 4px; }

  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .card h2 { font-size: 14px; margin: 0 0 12px; color: #334155; font-weight: 600; }
  .line { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #475569; }
  .line b { color: #1e293b; }

  .insight { font-size: 14px; color: #475569; margin: 4px 0; }
  .insight b { color: #0f172a; }
  .warn { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; background: #fffbeb; color: #92400e; border: 1px solid #fde68a; border-radius: 10px; padding: 8px 12px; margin-top: 10px; }

  label.f { display: block; font-size: 12px; color: #64748b; margin-bottom: 6px; }
  input, select { font: inherit; border: 1px solid #cbd5e1; border-radius: 10px; padding: 9px 11px; font-size: 14px; width: 100%; background: #fff; color: #1e293b; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .hbtns { display: flex; gap: 6px; }
  .hbtn { padding: 8px 10px; border-radius: 10px; font-size: 12px; border: 1px solid #cbd5e1; background: #fff; color: #475569; cursor: pointer; }
  .hbtn.on { background: #4f46e5; color: #fff; border-color: #4f46e5; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #475569; }
  .check input { width: auto; }
  .add { width: 100%; background: #4f46e5; color: #fff; border: none; border-radius: 10px; padding: 11px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 4px; }
  .add:hover { background: #4338ca; }
  .mb { margin-bottom: 8px; }
  .mt { margin-top: 10px; }

  .item { display: flex; align-items: center; gap: 10px; border-radius: 10px; padding: 8px 10px; }
  .item.future { background: #eef2ff55; }
  .item.past { background: #f8fafc; }
  .bar { width: 5px; height: 34px; border-radius: 999px; flex-shrink: 0; }
  .bar.annual { background: #818cf8; }
  .bar.sick { background: #2dd4bf; }
  .item .main { flex: 1; min-width: 0; }
  .item .d { font-size: 14px; color: #1e293b; }
  .item .d .meta { color: #94a3b8; }
  .item .m2 { font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .item .note { color: #64748b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 55%; }
  .item .after { color: #94a3b8; }
  .item .after.neg { color: #dc2626; font-weight: 600; }
  .del { background: none; border: none; color: #94a3b8; cursor: pointer; padding: 6px; border-radius: 8px; font-size: 15px; }
  .del:hover { color: #dc2626; background: #fff; }

  .foot { text-align: center; font-size: 11px; color: #94a3b8; margin-top: 16px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Leave Tracker</h1>
      <div class="sub">Auto-accrues every payday</div>
    </div>
    <button class="iconbtn" id="gearBtn" aria-label="Settings">⚙️</button>
  </div>

  <div class="cards">
    <div class="bal annual">
      <div class="lab">💼 Annual leave</div>
      <div class="big"><span id="balAnnual">0</span><span> h</span></div>
      <div class="days" id="daysAnnual">0 days</div>
    </div>
    <div class="bal sick">
      <div class="lab">🩺 Sick leave</div>
      <div class="big"><span id="balSick">0</span><span> h</span></div>
      <div class="days" id="daysSick">0 days</div>
    </div>
  </div>

  <div class="card">
    <div class="line">📅 <span id="nextPay"></span></div>
  </div>

  <div class="card">
    <h2>✨ What you can do</h2>
    <div class="insight" id="ins1"></div>
    <div class="insight" id="ins2"></div>
    <div class="warn hidden" id="capWarn"></div>
  </div>

  <div class="card">
    <h2>Add time off</h2>
    <div class="row mb">
      <div>
        <label class="f">Start</label>
        <input type="date" id="startDate">
      </div>
      <div>
        <label class="f">End</label>
        <input type="date" id="endDate">
      </div>
    </div>
    <div class="row mb">
      <div>
        <label class="f">Type</label>
        <select id="type">
          <option value="annual">Annual</option>
          <option value="sick">Sick</option>
        </select>
      </div>
      <div>
        <label class="f">Hours / day</label>
        <input type="number" id="hours" min="0" step="0.5" value="8">
      </div>
    </div>
    <div class="hbtns mb">
      <button class="hbtn on" data-h="8">Full day</button>
      <button class="hbtn" data-h="4">Half</button>
      <button class="hbtn" data-h="2">2h</button>
      <button class="hbtn" data-h="1">1h</button>
    </div>
    <label class="check mb"><input type="checkbox" id="skipWk" checked> Skip weekends</label>
    <input type="text" id="note" class="mb" placeholder="Note (optional) — e.g. beach trip">
    <button class="add" id="addBtn">+ Add</button>
  </div>

  <div class="card hidden" id="listCard">
    <h2>Your time off</h2>
    <div id="list"></div>
  </div>

  <div class="card hidden" id="settingsCard">
    <h2>Settings</h2>
    <label class="f">First payday</label>
    <input type="date" id="firstPay" class="mb">
    <label class="f">Service start (drives 3 &amp; 15-yr tiers)</label>
    <input type="date" id="svcStart" class="mb">
    <div class="row mb">
      <div>
        <label class="f">Starting annual (h)</label>
        <input type="number" id="startAnnual" step="0.5">
      </div>
      <div>
        <label class="f">Starting sick (h)</label>
        <input type="number" id="startSick" step="0.5">
      </div>
    </div>
    <label class="f">Annual use-or-lose cap (h)</label>
    <input type="number" id="cap" step="1">
  </div>

  <div class="foot">Saved on this device · works offline</div>
</div>

<script>
const KEY = "leaveTracker.v2";
const DAY = 8;
const DEFAULTS = {
  firstPayDate: "2026-09-11",
  serviceStartDate: "2026-09-11",
  startingAnnual: 0,
  startingSick: 0,
  annualCap: 240,
};

let settings = { ...DEFAULTS };
let timeOff = [];

// storage: prefer Claude's window.storage in preview, else localStorage when hosted
const hasWS = typeof window !== "undefined" && window.storage && typeof window.storage.get === "function";
async function loadState() {
  let raw = null;
  try { raw = hasWS ? (await window.storage.get(KEY))?.value : localStorage.getItem(KEY); } catch (e) {}
  if (raw) {
    try {
      const d = JSON.parse(raw);
      if (d.settings) settings = { ...DEFAULTS, ...d.settings };
      if (Array.isArray(d.timeOff)) timeOff = d.timeOff;
    } catch (e) {}
  }
}
async function saveState() {
  const v = JSON.stringify({ settings, timeOff });
  try { if (hasWS) await window.storage.set(KEY, v); else localStorage.setItem(KEY, v); } catch (e) {}
}

// date helpers (local)
function parseDate(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function fmt(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function pretty(d){ return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function today0(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function fullYears(start,end){ let y=end.getFullYear()-start.getFullYear(); const a=new Date(end.getFullYear(),start.getMonth(),start.getDate()); if(end<a) y--; return y; }

// accrual
function annualRate(svc,pd){ const y=fullYears(svc,pd); if(y<3)return 4; if(y<15)return 6; return 8; }
function lastPPOfYear(pd){ return addDays(pd,14).getFullYear()!==pd.getFullYear(); }
function accrualFor(svc,pd){ const base=annualRate(svc,pd); let a=base; if(base===6&&lastPPOfYear(pd)) a+=4; return {annual:a,sick:4}; }
function accruedThrough(date){
  const svc=parseDate(settings.serviceStartDate);
  let pd=parseDate(settings.firstPayDate), an=0, sk=0, g=0;
  while(pd<=date && g<5000){ const x=accrualFor(svc,pd); an+=x.annual; sk+=x.sick; pd=addDays(pd,14); g++; }
  return { annual: an+Number(settings.startingAnnual||0), sick: sk+Number(settings.startingSick||0) };
}
function nextPayday(date){
  const svc=parseDate(settings.serviceStartDate);
  let pd=parseDate(settings.firstPayDate), g=0;
  while(pd<=date && g<5000){ pd=addDays(pd,14); g++; }
  return { date: pd, accrual: accrualFor(svc,pd) };
}

// ranges
function workdays(start,end,skip){
  let d=new Date(start), c=0, g=0;
  while(d<=end && g<4000){ const w=d.getDay(); if(!skip||(w!==0&&w!==6)) c++; d=addDays(d,1); g++; }
  return c;
}
function entryHoursThrough(e,date){
  const s=parseDate(e.start), en=parseDate(e.end), cap=date<en?date:en;
  if(cap<s) return 0;
  return workdays(s,cap,e.skipWeekends)*Number(e.hoursPerDay||0);
}
function entryTotal(e){ return workdays(parseDate(e.start),parseDate(e.end),e.skipWeekends)*Number(e.hoursPerDay||0); }
function usedThrough(type,date){ return timeOff.filter(e=>e.type===type).reduce((s,e)=>s+entryHoursThrough(e,date),0); }

function fmtH(h){ const r=Math.round(h*10)/10; return Number.isInteger(r)?String(r):r.toFixed(1); }
function fmtD(h){ const r=Math.round((h/DAY)*10)/10; return Number.isInteger(r)?String(r):r.toFixed(1); }
function prettyRange(e){
  const s=parseDate(e.start), en=parseDate(e.end);
  if(fmt(s)===fmt(en)) return pretty(s);
  const sameY=s.getFullYear()===en.getFullYear();
  const sOpt=sameY?{month:"short",day:"numeric"}:{month:"short",day:"numeric",year:"numeric"};
  return s.toLocaleDateString(undefined,sOpt)+" – "+en.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
}

function render(){
  const now = today0();
  const acc = accruedThrough(now);
  const balAnnual = acc.annual - usedThrough("annual", now);
  const balSick = acc.sick - usedThrough("sick", now);

  document.getElementById("balAnnual").textContent = fmtH(balAnnual);
  document.getElementById("balSick").textContent = fmtH(balSick);
  document.getElementById("daysAnnual").textContent = fmtD(balAnnual)+" days";
  document.getElementById("daysSick").textContent = fmtD(balSick)+" days";

  const np = nextPayday(now);
  document.getElementById("nextPay").innerHTML =
    "Next payday <b>"+pretty(np.date)+"</b> — +"+np.accrual.annual+" annual, +"+np.accrual.sick+" sick";

  const dec31 = new Date(now.getFullYear(),11,31);
  const ye = accruedThrough(dec31);
  const yeAnnual = ye.annual - usedThrough("annual", dec31);
  const yeSick = ye.sick - usedThrough("sick", dec31);
  document.getElementById("ins1").innerHTML =
    "You can take about <b>"+fmtD(balAnnual)+" full days</b> of annual leave right now.";
  document.getElementById("ins2").innerHTML =
    "Projected end of "+now.getFullYear()+": <b>"+fmtH(yeAnnual)+"h</b> annual · <b>"+fmtH(yeSick)+"h</b> sick.";

  const capW = document.getElementById("capWarn");
  if (yeAnnual > Number(settings.annualCap||Infinity)) {
    capW.classList.remove("hidden");
    capW.innerHTML = "⚠️ You're on track to end the year above the "+settings.annualCap+"h annual cap — anything over may be use-or-lose. Book some time off to be safe.";
  } else capW.classList.add("hidden");

  const sorted = [...timeOff].sort((a,b)=>parseDate(a.start)-parseDate(b.start));
  const listCard = document.getElementById("listCard");
  const list = document.getElementById("list");
  if (sorted.length === 0) { listCard.classList.add("hidden"); list.innerHTML = ""; }
  else {
    listCard.classList.remove("hidden");
    list.innerHTML = sorted.map(e=>{
      const en = parseDate(e.end);
      const past = en < now;
      const proj = accruedThrough(en)[e.type] - usedThrough(e.type, en);
      const neg = proj < 0;
      const total = entryTotal(e);
      return '<div class="item '+(past?"past":"future")+'">'
        + '<div class="bar '+e.type+'"></div>'
        + '<div class="main">'
        +   '<div class="d">'+prettyRange(e)+' <span class="meta">· '+fmtH(total)+'h '+e.type+'</span></div>'
        +   '<div class="m2">'
        +     (e.note?'<span class="note">'+escapeHtml(e.note)+'</span>':'')
        +     '<span class="after'+(neg?' neg':'')+'">'+(neg?'⚠ over balance ':'balance after: ')+fmtH(proj)+'h</span>'
        +   '</div>'
        + '</div>'
        + '<button class="del" data-id="'+e.id+'" aria-label="Delete">🗑</button>'
        + '</div>';
    }).join("");
  }
  saveState();
}

function escapeHtml(s){ return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// ---- wiring ----
function bind(){
  // hour quick buttons
  document.querySelectorAll(".hbtn").forEach(b=>{
    b.addEventListener("click",()=>{
      document.querySelectorAll(".hbtn").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      document.getElementById("hours").value = b.dataset.h;
    });
  });
  document.getElementById("hours").addEventListener("input",()=>{
    document.querySelectorAll(".hbtn").forEach(x=>x.classList.remove("on"));
  });
  // start auto-fills end
  document.getElementById("startDate").addEventListener("change",e=>{
    const end = document.getElementById("endDate");
    if(!end.value || end.value < e.target.value) end.value = e.target.value;
  });
  // add
  document.getElementById("addBtn").addEventListener("click",()=>{
    const start = document.getElementById("startDate").value;
    let end = document.getElementById("endDate").value;
    const hours = Number(document.getElementById("hours").value);
    if(!start || !hours){ return; }
    if(!end || end < start) end = start;
    timeOff.push({
      id: Date.now()+"-"+Math.random().toString(36).slice(2,7),
      type: document.getElementById("type").value,
      start, end,
      hoursPerDay: hours,
      skipWeekends: document.getElementById("skipWk").checked,
      note: document.getElementById("note").value.trim(),
    });
    document.getElementById("note").value = "";
    render();
  });
  // delete (delegation)
  document.getElementById("list").addEventListener("click",e=>{
    const btn = e.target.closest(".del");
    if(!btn) return;
    timeOff = timeOff.filter(x=>String(x.id)!==String(btn.dataset.id));
    render();
  });
  // settings toggle
  document.getElementById("gearBtn").addEventListener("click",()=>{
    document.getElementById("settingsCard").classList.toggle("hidden");
  });
  // settings inputs
  const map = {
    firstPay:"firstPayDate", svcStart:"serviceStartDate",
    startAnnual:"startingAnnual", startSick:"startingSick", cap:"annualCap"
  };
  Object.entries(map).forEach(([id,key])=>{
    document.getElementById(id).addEventListener("change",e=>{
      settings[key] = (id==="firstPay"||id==="svcStart") ? e.target.value : Number(e.target.value);
      render();
    });
  });
}

function fillSettings(){
  document.getElementById("firstPay").value = settings.firstPayDate;
  document.getElementById("svcStart").value = settings.serviceStartDate;
  document.getElementById("startAnnual").value = settings.startingAnnual;
  document.getElementById("startSick").value = settings.startingSick;
  document.getElementById("cap").value = settings.annualCap;
  document.getElementById("startDate").value = fmt(today0());
}

(async function init(){
  await loadState();
  fillSettings();
  bind();
  render();
})();
</script>
